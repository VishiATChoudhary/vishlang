[author]
names = ["Vishi"]                 # display names as they appear in WhatsApp exports
emails = ["vishisht@invertix.ai"]  # From: addresses in Gmail Takeout

[model]
base = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

[clean]
min_words = 8
ai_threshold = 0.5
merge_minutes = 2
holdout = 0.1

# weight 0 excludes a source. weight >= 1 repeats its examples round(weight) times in training.
# before = "YYYY-MM" drops anything written on or after that month (set to when you started drafting with LLMs).
[sources.whatsapp]
weight = 1.0
before = ""
[sources.gmail]
weight = 1.0
before = ""
[sources.docs]
weight = 1.0
before = ""
[sources.linkedin]
weight = 1.0
before = ""
[sources.chatgpt]
weight = 0.0
before = ""
